name: Continuous Publish
on:
  push:
    branches:
      - main
    paths-ignore:
      - ".github/**"
permissions:
  id-token: write # Provenance signing

jobs:
  lookup:
    runs-on: ubuntu-latest
    outputs:
      workspaces: ${{ steps.matrix.outputs.workspaces }}
    steps:
      - uses: actions/checkout@v6
      - run: npm install --no-audit --no-fund --no-package-lock --ignore-scripts --omit=optional
      - id: matrix
        run: echo "workspaces=$(npm query .workspace | jq -c '[.[].location]')" >> "$GITHUB_OUTPUT"

  release:
    needs: lookup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # Don't stop publishing if another package fails
      matrix:
        workspace: ${{ fromJson(needs.lookup.outputs.workspaces) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          registry-url: "https://registry.npmjs.org"

      - run: npm install --no-audit --no-fund --no-package-lock --ignore-scripts --omit=optional

      - working-directory: ${{ matrix.workspace }}
        run: npm test

      - working-directory: ${{ matrix.workspace }}
        id: gatekeeper
        run: |
          PKG_NAME=$(jq -r .name package.json)
          PKG_VERSION=$(jq -r .version package.json)

          if npm view "${PKG_NAME}@${PKG_VERSION}" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$PKG_VERSION" == *-* ]]; then
            NPM_TAG=$(echo "$PKG_VERSION" | cut -d'-' -f2 | cut -d'.' -f1)
          else
            NPM_TAG="latest"
          fi

          echo "skip=false" >> $GITHUB_OUTPUT
          echo "tag=$NPM_TAG" >> $GITHUB_OUTPUT

      - if: steps.gatekeeper.outputs.skip != 'true'
        working-directory: ${{ matrix.workspace }}
        run: npm publish --tag ${{ steps.gatekeeper.outputs.tag }} --provenance --access public
